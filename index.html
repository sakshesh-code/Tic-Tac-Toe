<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>
<body>
    
    <button class="start-game" command="show-modal" commandfor="pick-name">
        StartGame
    </button>
    <button id="play-game" hidden>Play Game</button>

    <dialog id="pick-name">
        <form action="" method="get">

            <fieldset>

            <legend>
                Please enter a name for player1 and player2
            </legend>

            <label for="player1">
                <input type="text" id="player1" name="player1Name" placeholder="Player1 name">
            </label>

            <label for="player2">
                <input type="text" id="player2" name="player2Name" placeholder="Player2 name">
            </label>

            <button type="submit" id="submit-btn">Done</button>
        </fieldset>
        </form>

        <button class="close" commandfor="pick-name" command="close">
            X
        </button>

    </dialog>

    <footer>
        <p>Photo By <a href="https://unsplash.com/@andyjh07?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Andy Holmes</a>
        on <a href="https://unsplash.com/">Unsplash</a></p>
    </footer>
</body>
</html>
